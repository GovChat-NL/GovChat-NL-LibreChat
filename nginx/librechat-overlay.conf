map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# These zones intentionally use the direct peer address. Do not trust a client-supplied
# X-Forwarded-For header for rate limiting without configuring known proxy source ranges.
limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;
limit_req_zone $binary_remote_addr zone=overlay_api_per_ip:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=normalize_image_per_ip:10m rate=12r/m;

server_tokens off;

upstream librechat_upstream {
    server librechat:3080;
}

# ========================================================
# LIBRECHAT (Front-end voor gebruikers)
# ========================================================
server {
    listen 3080 default_server;
    server_name laica-pentest-u30440.vm.elestio.app localhost;
    client_max_body_size 100m;
    limit_conn per_ip_connections 30;
    limit_conn_status 429;
    limit_req_status 429;

    # Baseline browser protections. CSP and HSTS are deliberately excluded until
    # overlay compatibility and end-to-end HTTPS coverage have been validated.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;

    # GovChat Overlay Assets (CSS / JS)
    location /govchat-overlay/ {
        alias /opt/librechat/overlay/publish/;
        try_files $uri =404;
        client_max_body_size 64k;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ========================================================
    # BEVEILIGDE AFBEELDINGEN: /images/<user-id>/<file>.png
    # ========================================================
    location /images/ {
        # 1. Bezoeker MOET ingelogd zijn
        if ($cookie_refreshToken = "") {
            return 401;
        }

        # 2. Beveiliging tegen direct linken (BOLA / IDOR preventie):
        # Afbeeldingen mogen UITSLUITEND worden ingeladen vanuit een actieve chat (/c/)
        # of een officieel gedeelde chat (/share/).
        # Direct plakken in de adresbalk (lege Referer) of externe links (Teams/mail) worden direct geweigerd!
        if ($http_referer !~* "^https?://[^/]+/(c/|share/|d/|$)") {
            return 403;
        }

        # 3. Proxy door naar LibreChat
        proxy_pass http://librechat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # 4. Security headers voor compliance
        expires 1h;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }


    # ------------------------------------------------------------------------
    # Private Excel artifact downloads. Files are never exposed by Nginx as a
    # static directory: excel-artifacts validates the LibreChat refresh JWT and
    # artifact owner before it streams the requested XLSX file.
    # ------------------------------------------------------------------------
    location ~ "^/api/files/download/[0-9a-fA-F-]{36}$" {
        limit_except GET { deny all; }
        client_max_body_size 0;
        proxy_pass http://excel-artifacts:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Dedicated high-cost image normalisation helper: strict body and request limits.
    location = /govchat-api/config/orchestrator/normalize-image {
        client_max_body_size 1100k;
        limit_req zone=normalize_image_per_ip burst=4 nodelay;
        proxy_pass http://govchat-overlay-admin:3002/api/config/orchestrator/normalize-image;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-store" always;
    }

    # GovChat Overlay API (nodig voor de overlay functies in de chat)
    # /govchat-api/foo wordt intern /api/foo.
    location ^~ /govchat-api/ {
        client_max_body_size 13m;
        limit_req zone=overlay_api_per_ip burst=30 nodelay;
        proxy_pass http://govchat-overlay-admin:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-store" always;
    }

    # LibreChat Applicatie
    location / {
        proxy_pass http://librechat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";

        # Streaming / SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Overlay injectie in HTML
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '</head>' '<link rel="stylesheet" href="/govchat-overlay/custom.css?v=20260904-uihide2"/><link rel="stylesheet" href="/govchat-overlay/ui-overrides.css?v=20260904-uihide2"/><script defer src="/govchat-overlay/loader.js?v=20260904-uihide2"></script></head>';
    }
}